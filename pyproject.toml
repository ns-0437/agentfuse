[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfuse"
version = "0.1.0"
description = "A logical circuit breaker for long-range autonomous agents: detects loops, drift, logic traps and runaway spend, then steers the agent back on track with a separate reasoning model."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "AgentFuse" }]
keywords = ["agents", "agentkit", "observability", "guardrails", "llm", "autonomy", "openai", "langgraph"]
dependencies = []  # core is stdlib-only

[project.optional-dependencies]
pretty = ["rich>=13.0.0"]
openai = ["openai>=1.40.0"]
agentkit = ["openai-agents>=0.18.0"]
langgraph = ["langgraph>=0.2.0", "langchain-core>=0.3.0"]
all = ["rich>=13.0.0", "openai>=1.40.0", "openai-agents>=0.18.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentfuse*"]
