[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfuse"
version = "0.1.0"
description = "A logical circuit breaker for long-range autonomous agents: detects loops, drift, logic traps and runaway spend, then steers the agent back on track with a deterministic recovery ladder (an optional separate reasoning model can write corrections instead, but currently underperforms the ladder)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "AgentFuse" }]
keywords = ["agents", "agentkit", "observability", "guardrails", "llm", "autonomy", "openai", "langgraph"]
dependencies = []  # core is stdlib-only

[project.optional-dependencies]
pretty = ["rich>=13.0.0"]
openai = ["openai>=1.40.0"]
agentkit = ["openai-agents>=0.18.0"]
memory = ["qdrant-client>=1.9.0"]
# Local ONNX embeddings: no API key, no network, ~120MB, ~4ms/sentence on CPU.
embeddings = ["fastembed>=0.3.0"]
langgraph = ["langgraph>=0.2.0", "langchain-core>=0.3.0"]
all = ["rich>=13.0.0", "openai>=1.40.0", "openai-agents>=0.18.0", "qdrant-client>=1.9.0", "fastembed>=0.3.0", "langgraph>=0.2.0", "langchain-core>=0.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentfuse*"]

[tool.mypy]
ignore_missing_imports = true
# NOT warn_unused_ignores: several `# type: ignore` comments in evals/test_*.py
# (test_memory.py, test_toolcall_shim.py) exist only to suppress errors that
# appear under --check-untyped-defs, a stricter mode this project's CI does
# not run. Under this config's plain settings they report as "unused" even
# though they are correctly needed for the stricter local runs this project
# does periodically -- so enabling this flag here would demand deleting
# ignores that are still doing real work elsewhere. Spot-check with
# `mypy --warn-unused-ignores --check-untyped-defs` locally instead, which
# tells the two cases apart correctly.

# generators.py/generators_extra.py's DOMAINS structure is a large, deeply
# heterogeneous dict-of-dicts (str values, list-of-str values, and callables)
# that mypy cannot structurally infer, producing a 30+ line error cascade with
# zero runtime risk (deliberately assessed and deferred: restructuring a
# heavily-tested, load-bearing file for a check this project doesn't
# otherwise enforce was judged too risky for the value). `ignore_errors`
# suppresses ALL mypy checking in these two files, not just the known
# cascade -- stated plainly because that is a real gap, not a narrow
# exception: a genuinely new type error introduced in either file will NOT
# fail CI. Every other module in the project is fully checked.
[[tool.mypy.overrides]]
module = ["evals.generators", "evals.generators_extra"]
ignore_errors = true
